<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>Vyttah campaign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f7f4;--bar:#efeeea;--ink:#141414;--muted:#6b6a66;--faint:#9b998f;--rule:#e2e0d8;--panel:#fff;--track:#ebe9e2;
--good:#138a4b;--bad:#c23450;--alt:#b9b6ab;--google:#eb6834;--meta:#2a78d6;--linkedin:#1baf7a;
--serif:"Instrument Serif","Times New Roman",Times,serif;--sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;
  background:rgba(239,238,234,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--rule)}
.mark{font:28px/1 var(--serif);letter-spacing:.01em}.bmeta{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.35}
.page{max-width:720px;margin:0 auto;padding:28px 16px 72px}
.kick{font:600 11.5px/1.4 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
h1{font:400 clamp(34px,8vw,46px)/1.08 var(--serif);margin:0 0 18px;letter-spacing:-.01em}
h2{display:flex;align-items:center;gap:12px;font:600 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:44px 0 16px}
h2::after{content:"";flex:1;border-top:1px solid var(--rule)}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:20px;padding:20px}
.hero{display:flex;align-items:flex-end;gap:16px}.big{font:400 clamp(84px,22vw,120px)/.78 var(--serif);letter-spacing:-.03em}
.hero p{margin:0 0 6px;color:var(--muted);font-size:16px;line-height:1.4}.hero p b{color:var(--ink);font-weight:600}
.tla,.tll{position:relative;height:16px;font-size:11.5px;color:var(--faint)}.tla{margin-top:22px}
.tla span,.tll span{position:absolute;white-space:nowrap}.tla .r,.tll .r{transform:translateX(-100%)}
.tl{position:relative;height:8px;background:var(--track);border-radius:999px;margin:8px 0}
.tl .fill{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:999px;width:var(--w);transition:width 1.4s cubic-bezier(.2,.75,.25,1)}
.tl .tick{position:absolute;top:-4px;width:2px;height:16px;background:var(--faint);border-radius:2px}
.tl .now{position:absolute;top:-6px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--panel);border:4px solid var(--ink);left:var(--w);transition:left 1.4s cubic-bezier(.2,.75,.25,1)}
.pre .tl .fill{width:0}.pre .tl .now{left:0}
.daynote{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
.today{font-size:19px;line-height:1.5;margin:0 0 14px}.dlabel{font-size:13px;color:var(--muted);margin:0 0 8px}
.next{background:var(--ink);color:#f8f7f4;border-radius:18px;padding:16px 18px;font-size:16px}
.next .k,.k{display:block;font:600 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}.next .k{color:#b9b6ab}
.lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.lab .k{color:var(--muted);margin:0}.lab b{font:400 26px/1 var(--serif)}
.seg{display:flex;gap:5px;margin-bottom:16px}.seg i{flex:1;height:8px;border-radius:999px;background:var(--track);position:relative;overflow:hidden}
.seg i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.75,.25,1);transition-delay:calc(var(--n)*90ms + .3s)}
.seg i.on::after{transform:scaleX(1)}.pre .seg i.on::after{transform:scaleX(0)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.it{display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--muted);line-height:1.3}.it.on{color:var(--ink)}
.it small{display:block;font-size:11.5px;color:var(--faint)}
.dot{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--alt);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.it.on .dot{background:var(--ink);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:14px}
.tile .l{font-size:12.5px;color:var(--muted)}.tile .v{font-size:27px;font-weight:650;letter-spacing:-.015em;margin:2px 0 8px}.tile .v small{font-size:14px;font-weight:500;color:var(--muted)}
.mini{height:5px;background:var(--track);border-radius:999px;position:relative;overflow:hidden}.mini i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--ink);width:var(--w);transition:width 1.2s cubic-bezier(.2,.75,.25,1)}
.pre .mini i{width:0}.tile .s{font-size:12px;color:var(--muted);margin-top:7px}.good{color:var(--good)}.bad{color:var(--bad)}.mini i.good{background:var(--good)}.mini i.bad{background:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:6px}.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .b i{display:block;width:100%;background:var(--track);border-radius:6px;min-height:4px;height:var(--h);transition:height .9s cubic-bezier(.2,.75,.25,1)}.pre .bars .b i{height:4px}
.bars .b.now i{background:var(--ink)}.bars em{font-style:normal;font-size:12px;font-weight:600;margin-bottom:4px}.days{display:flex;gap:8px;margin-top:6px}.days span{flex:1;text-align:center;font-size:11px;color:var(--faint)}
.chart{position:relative;margin-top:4px;touch-action:pan-y}.chart svg{display:block;overflow:visible}
.chart .ax{font:11px var(--sans);fill:var(--faint)}.chart .gl{stroke:var(--rule);stroke-width:1}
.chart .pl{fill:none;stroke:var(--alt);stroke-width:1.5;stroke-dasharray:4 4}.chart .ac{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dl{font:600 12.5px var(--sans);fill:var(--ink)}.chart .pll{font:11.5px var(--sans);fill:var(--muted)}.chart .xh{stroke:var(--faint);stroke-width:1}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--ink);color:#f8f7f4;font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .12s}
.tip.on{opacity:1}.tip b{font-weight:650}.tip span{color:#b9b6ab}
.pace{font-size:13px;color:var(--muted);margin:-6px 0 10px}.pace b{color:var(--ink);font-weight:600}
.two{display:grid;gap:10px}@media (min-width:600px){.two{grid-template-columns:1fr 1fr}}
.two .bars{height:90px;gap:4px}.two .bars .b i{border-radius:4px 4px 1px 1px}.two .days{gap:4px;justify-content:space-between}.two .days span{flex:none;white-space:nowrap}
.bars .b{cursor:default}.bars .b:hover i{background:var(--muted)}.bars .b.now:hover i{background:var(--ink)}
.chn{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-top:1px solid var(--rule)}.chn:first-of-type{border-top:0;padding-top:4px}
.chn .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}.chn .nm i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.chn .rt{text-align:right;font-size:13.5px;color:var(--muted)}.chn .rt b{color:var(--ink);font-size:15px}
.chn .mini{grid-column:1/-1;height:6px}.chn .mini i{background:var(--c)}.chn .sub{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.chn.off .nm{color:var(--muted);font-weight:500}.chn.off .nm i{background:var(--track)}
.share{display:flex;gap:2px;height:10px;border-radius:999px;overflow:hidden;margin:2px 0 12px}.share i{background:var(--c);width:var(--w)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-bottom:14px}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.sample{position:sticky;top:63px;z-index:4;background:#c23450;color:#fff;text-align:center;font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:9px}
.wk{border-top:1px solid var(--rule)}.wk:last-child{border-bottom:1px solid var(--rule)}
.wkh{appearance:none;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;width:100%;display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:14px 0;-webkit-tap-highlight-color:transparent}
.num{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--alt);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:650;color:var(--muted)}
.wk.done .num{background:var(--ink);border-color:var(--ink);color:#fff}.wk.cur .num{border:2px solid var(--ink);color:var(--ink)}
.wt{font:400 22px/1.15 var(--serif)}.wd{font-size:12.5px;color:var(--muted)}
.pill{font:600 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:6px 9px;white-space:nowrap;border:1px solid var(--rule);color:var(--muted)}
.wk.cur .pill{background:var(--ink);border-color:var(--ink);color:#fff}.wk.done .pill{border-color:var(--ink);color:var(--ink)}
.wkb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}.wk.open .wkb{grid-template-rows:1fr}.wkb>div{overflow:hidden}
.wkb ul{margin:0 0 10px 50px;padding:0}.wkb li{font-size:14.5px;margin:0 0 4px}.wkb p{margin:0 0 16px 50px;font-size:13.5px;color:var(--muted)}.wkb p b{color:var(--ink);font-weight:600}
.log{position:relative;padding-left:22px}.log::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--track);border-radius:2px}
.ent{position:relative;margin-bottom:22px}.ent::before{content:"";position:absolute;left:-21px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.ent .dl{font-size:12.5px;color:var(--muted);margin-bottom:2px}.ent p{margin:0;font-size:15.5px}.ent .nx{font-size:13.5px;color:var(--muted);margin-top:4px}
.foot{margin-top:48px;font-size:12.5px;color:var(--muted);line-height:1.5;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.foot b{font:400 22px/1 var(--serif);color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.motion .rv{opacity:0}.motion .rv.in{animation:rise .65s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--i,0)*70ms)}.motion .rv.done{opacity:1;animation:none}
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lock .panel{width:100%;max-width:380px;text-align:center;padding:30px 24px}.lock .mark{font-size:40px}
.lock p{color:var(--muted);margin:6px 0 22px;font-size:15px}
.lock input{width:100%;font:16px var(--sans);padding:13px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--bg);color:var(--ink);outline:none}
.lock input:focus{border-color:var(--ink)}
.lock button{margin-top:12px;width:100%;appearance:none;border:0;border-radius:12px;padding:13px;font:600 15px var(--sans);background:var(--ink);color:#fff;cursor:pointer}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin-top:10px}
@media (prefers-reduced-motion:reduce){.motion .rv{opacity:1}.motion .rv.in{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var app = document.getElementById("app");
  var MOTION = !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  if (MOTION) document.documentElement.classList.add("motion");
  var KEY = "vyttah-key-v1";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function money(v) { return v == null ? "–" : "$" + Math.round(v).toLocaleString("en-US"); }
  function pct(a, b) { return b ? Math.max(0, Math.min(100, Math.round(100 * a / b))) : 0; }
  function d(iso) { return new Date(iso + "T12:00:00Z"); }
  function fmt(iso, o) { return d(iso).toLocaleDateString("en-US", Object.assign({ timeZone: "UTC" }, o)); }

  function deriveKey(pw, salt, iter) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }
  function decrypt(key, enc) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct)).then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function remember(key) {
    crypto.subtle.exportKey("jwk", key).then(function (j) { try { localStorage.setItem(KEY, JSON.stringify(j)); } catch (e) {} });
  }
  function savedKey() {
    var j; try { j = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { j = null; }
    return j ? crypto.subtle.importKey("jwk", j, { name: "AES-GCM" }, true, ["decrypt"]) : Promise.reject();
  }

  function lockScreen(enc, msg) {
    app.innerHTML = '<div class="lock"><div class="panel"><div class="mark">Vyttah</div><p>Campaign tracker</p>' +
      '<form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password"><button type="submit">Open</button></form>' +
      '<div class="err" id="err">' + esc(msg || "") + "</div></div></div>";
    var f = document.getElementById("f"), pw = document.getElementById("pw"), err = document.getElementById("err");
    pw.focus();
    f.addEventListener("submit", function (ev) {
      ev.preventDefault();
      if (!pw.value) { err.textContent = "Enter the password first."; return; }
      err.textContent = "Opening…";
      deriveKey(pw.value, b64(enc.salt), enc.iter).then(function (key) {
        return decrypt(key, enc).then(function (data) { remember(key); render(data); });
      }).catch(function () { err.textContent = "That password didn't work. Try again."; pw.select(); });
    });
  }

  function timeline(c, today) {
    var s = d(c.start), g = d(c.deadline), span = (g - s) / 864e5;
    var at = function (x) { return pct((d(x) - s) / 864e5, span); };
    return '<div class="tla"><span style="left:' + at(c.launch) + '%">ads start ' + fmt(c.launch, { month: "short", day: "numeric" }) + '</span>' +
      '<span class="r" style="left:' + at(c.end) + '%">campaign ends ' + fmt(c.end, { month: "short", day: "numeric" }) + "</span></div>" +
      '<div class="tl" style="--w:' + pct((d(today) - s) / 864e5, span) + '%"><div class="fill"></div><div class="tick" style="left:' + at(c.launch) + '%"></div>' +
      '<div class="tick" style="left:' + at(c.end) + '%"></div><div class="now"></div></div>' +
      '<div class="tll"><span style="left:0">' + fmt(c.start, { month: "short", day: "numeric" }) + '</span><span class="r" style="left:100%">go-live Jan 1</span></div>';
  }

  var CH = [["google", "Google"], ["meta", "Meta"], ["linkedin", "LinkedIn"]];
  function at(path, iso) {  // value of a dated path at a date, straight lines between points
    var t = d(iso);
    if (t <= d(path[0].date)) return path[0].v;
    for (var i = 1; i < path.length; i++) {
      var a = path[i - 1], b = path[i];
      if (t <= d(b.date)) return a.v + (b.v - a.v) * (t - d(a.date)) / ((d(b.date) - d(a.date)) || 1);
    }
    return path[path.length - 1].v;
  }

  function setupPanel(x) {
    var segs = x.setup.map(function (i, n) { return '<i class="' + (i.done ? "on" : "") + '" style="--n:' + n + '"></i>'; }).join("");
    var grid = x.setup.map(function (i) {
      return '<div class="it' + (i.done ? " on" : "") + '"><span class="dot">' + (i.done ? "✓" : "") + "</span><span>" + esc(i.item) +
        (i.done ? "<small>" + fmt(i.done, { month: "short", day: "numeric" }) + "</small>" : "") + "</span></div>";
    }).join("");
    return '<div class="panel rv"><div class="lab"><span class="k">Setup before ads start</span><b>' + x.setup_done + " of " + x.setup.length + '</b></div>' +
      '<div class="seg">' + segs + '</div><div class="grid">' + grid + "</div></div>";
  }

  function scoreboard(x) {
    var c = x.campaign, sr = x.series || [];
    if (!sr.length) return setupPanel(x);
    var last = sr[sr.length - 1], leads = last.leads || 0, spend = last.spend || 0;
    var cpl = leads ? spend / leads : null, cls = cpl == null ? "" : (cpl <= c.target_cpl ? "good" : "bad");
    var planLeads = Math.round(at(x.lead_path, last.date)), planSpend = at(x.spend_path, last.date);
    var gap = leads - planLeads;
    var html = '<p class="pace rv">Numbers as of <b>' + fmt(last.date, { weekday: "short", month: "short", day: "numeric" }) + "</b>, from HubSpot and the ad accounts.</p>" +
      '<div class="tiles rv">' +
      '<div class="tile"><div class="l">Leads</div><div class="v">' + leads + "<small> / " + c.target_leads + '</small></div><div class="mini"><i style="--w:' + pct(leads, c.target_leads) + '%"></i></div>' +
        '<div class="s">' + (gap >= 0 ? '<span class="good">' + gap + " ahead</span>" : '<span class="bad">' + (-gap) + " behind</span>") + " of plan (" + planLeads + ")</div></div>" +
      '<div class="tile"><div class="l">Money spent</div><div class="v">' + money(spend) + '</div><div class="mini"><i style="--w:' + pct(spend, c.budget) + '%"></i></div>' +
        '<div class="s">of ' + money(c.budget) + " · plan " + money(planSpend) + "</div></div>" +
      '<div class="tile"><div class="l">Cost per lead</div><div class="v ' + cls + '">' + money(cpl) + '</div><div class="mini"><i class="' + cls + '" style="--w:' + pct(cpl || 0, c.target_cpl * 1.5) + '%"></i></div>' +
        '<div class="s">' + (cpl == null ? "target " + money(c.target_cpl) : (cpl <= c.target_cpl ? "under" : "over") + " the " + money(c.target_cpl) + " target") + "</div></div>" +
      '<div class="tile"><div class="l">Good leads</div><div class="v">' + (last.good == null ? "–" : last.good) + '</div>' +
        '<div class="s">' + (last.good == null || !leads ? "tagged by sales" : pct(last.good, leads) + "% of leads, tagged by sales") + "</div></div></div>" +
      '<div class="panel rv" style="margin-top:10px"><div class="lab"><span class="k">Leads vs the plan</span><b>' + leads + '</b></div><div class="chart" id="ch-leads"></div></div>' +
      '<div class="panel rv" style="margin-top:10px"><div class="lab"><span class="k">Money spent vs the plan</span><b>' + money(spend) + '</b></div><div class="chart" id="ch-spend"></div></div>';

    var steps = sr.slice(-14).map(function (e) {
      var i = sr.indexOf(e), p = i ? sr[i - 1] : { leads: 0, spend: 0, date: null };
      return { date: e.date, from: p.date, leads: (e.leads || 0) - (p.leads || 0), spend: (e.spend || 0) - (p.spend || 0) };
    });
    html += '<div class="two rv" style="margin-top:10px">' + barPanel("New leads", steps, "leads", String) + barPanel("Money spent", steps, "spend", money) + "</div>";

    var cb = x.channel_budget || {}, shown = CH.filter(function (k) { return cb[k[0]]; });
    var tl = shown.reduce(function (a, k) { return a + (((last.ch || {})[k[0]] || {}).leads || 0); }, 0);
    html += '<h2 class="rv">By channel</h2><div class="panel rv"><div class="legend">' + shown.map(function (k) { return '<span style="--c:var(--' + k[0] + ')"><i></i>' + k[1] + "</span>"; }).join("") + "</div>" +
      (tl ? '<div class="lab" style="margin-bottom:6px"><span class="k">Share of leads</span></div><div class="share">' + shown.map(function (k) {
        var n = ((last.ch || {})[k[0]] || {}).leads || 0; return n ? '<i style="--c:var(--' + k[0] + ');--w:' + (100 * n / tl) + '%" title="' + k[1] + ": " + n + '"></i>' : "";
      }).join("") + "</div>" : "") +
      shown.map(function (k) {
        var v = (last.ch || {})[k[0]], b = cb[k[0]];
        if (!v || !(v.spend || v.leads)) return '<div class="chn off" style="--c:var(--' + k[0] + ')"><span class="nm"><i></i>' + k[1] + '</span><span class="rt">not started</span><div class="sub"><span>budget ' + money(b) + "</span></div></div>";
        var cc = v.leads ? v.spend / v.leads : null, ok = cc == null ? "" : cc <= c.target_cpl ? "good" : "bad";
        return '<div class="chn" style="--c:var(--' + k[0] + ')"><span class="nm"><i></i>' + k[1] + '</span><span class="rt"><b>' + (v.leads || 0) + "</b> leads · " +
          '<span class="' + ok + '">' + (cc == null ? "no leads yet" : money(cc) + " each") + "</span></span>" +
          '<div class="mini"><i style="--w:' + pct(v.spend || 0, b) + '%"></i></div><div class="sub"><span>' + money(v.spend) + " spent</span><span>of " + money(b) + "</span></div></div>";
      }).join("") +
      (cb.reserve ? '<div class="sub" style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px"><span>Reserve for the winner (week 5)</span><span>' + money(cb.reserve) + "</span></div>" : "") + "</div>";
    return html;
  }

  function barPanel(title, steps, key, f) {
    var top = Math.max.apply(null, steps.map(function (e) { return e[key]; })) || 1, lastv = steps[steps.length - 1][key];
    return '<div class="panel"><div class="lab"><span class="k">' + title + '</span><b>' + f(lastv) + '</b></div><div class="bars">' +
      steps.map(function (e, i) {
        var when = e.from && (d(e.date) - d(e.from)) / 864e5 > 1 ? fmt(e.from, { month: "short", day: "numeric" }) + " to " + fmt(e.date, { month: "short", day: "numeric" }) : fmt(e.date, { weekday: "short", month: "short", day: "numeric" });
        return '<div class="b' + (i === steps.length - 1 ? " now" : "") + '" data-tip="' + esc("<b>" + f(e[key]) + "</b> <span>" + when + "</span>") + '"><i style="--h:' + Math.max(4, Math.round(92 * e[key] / top)) + '%"></i></div>';
      }).join("") + '</div><div class="days">' + steps.map(function (e, i) {
        return i === 0 || i === steps.length - 1 ? "<span>" + fmt(e.date, { month: "short", day: "numeric" }) + "</span>" : "";
      }).join("") + "</div></div>";
  }

  function lineChart(host, o) {
    if (!host) return;
    var W = host.clientWidth, H = 200, L = 40, R = 58, T = 14, B = 26;
    var s = d(o.start), span = (d(o.end) - s) || 1;
    var X = function (iso) { return L + (W - L - R) * Math.max(0, Math.min(1, (d(iso) - s) / span)); };
    var Y = function (v) { return T + (H - T - B) * (1 - v / o.ymax); };
    var g = "";
    for (var i = 0; i <= o.n; i++) {
      var v = o.ymax * i / o.n;
      g += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="ax" x="' + (L - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + o.f(v) + "</text>";
    }
    [[o.start, "start"], ["2026-11-15", "middle"], ["2026-12-06", "middle"], [o.end, "end"]].forEach(function (t) {
      g += '<text class="ax" x="' + X(t[0]) + '" y="' + (H - 6) + '" text-anchor="' + t[1] + '">' + fmt(t[0], { month: "short", day: "numeric" }) + "</text>";
    });
    var line = function (pts) { return pts.map(function (p) { return X(p.date).toFixed(1) + "," + Y(p.v).toFixed(1); }).join(" "); };
    var lp = o.plan[o.plan.length - 1], la = o.pts[o.pts.length - 1];
    g += '<polyline class="pl" points="' + line(o.plan) + '"/><text class="pll" x="' + (X(lp.date) + 8) + '" y="' + (Y(lp.v) + 4) + '">plan ' + o.f(lp.v) + "</text>";
    g += '<polyline class="ac" points="' + line(o.pts) + '"/><circle cx="' + X(la.date) + '" cy="' + Y(la.v) + '" r="4.5" fill="var(--ink)" stroke="var(--panel)" stroke-width="2"/>' +
      '<text class="dl" x="' + (X(la.date) + 9) + '" y="' + (Y(la.v) - 8) + '">' + o.f(la.v) + "</text>";
    g += '<g id="hv" style="display:none"><line class="xh" y1="' + T + '" y2="' + (H - B) + '"/><circle r="4.5" fill="var(--ink)" stroke="var(--panel)" stroke-width="2"/></g>';
    host.innerHTML = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(o.label) + '">' + g + '</svg><div class="tip"></div>';
    var svg = host.querySelector("svg"), hv = svg.querySelector("#hv"), tip = host.querySelector(".tip");
    function show(ev) {
      var r = svg.getBoundingClientRect(), mx = ev.clientX - r.left, best = null;
      o.pts.forEach(function (p) { if (!best || Math.abs(X(p.date) - mx) < Math.abs(X(best.date) - mx)) best = p; });
      var px = X(best.date), py = Y(best.v);
      hv.style.display = ""; hv.firstChild.setAttribute("x1", px); hv.firstChild.setAttribute("x2", px);
      hv.lastChild.setAttribute("cx", px); hv.lastChild.setAttribute("cy", py);
      tip.innerHTML = "<b>" + o.f(best.v) + "</b> <span>" + fmt(best.date, { month: "short", day: "numeric" }) + " · plan " + o.f(at(o.plan, best.date)) + "</span>";
      tip.style.left = Math.max(70, Math.min(W - 70, px)) + "px"; tip.style.top = py + "px"; tip.classList.add("on");
    }
    svg.addEventListener("pointermove", show); svg.addEventListener("pointerdown", show);
    svg.addEventListener("pointerleave", function () { hv.style.display = "none"; tip.classList.remove("on"); });
  }

  function charts(x) {
    var sr = x.series || [];
    if (!sr.length) return;
    var c = x.campaign, s0 = x.lead_path[0].date;
    var lp = [{ date: s0, v: 0 }].concat(sr.map(function (e) { return { date: e.date, v: e.leads || 0 }; }));
    var spp = [{ date: x.spend_path[0].date, v: 0 }].concat(sr.map(function (e) { return { date: e.date, v: e.spend || 0 }; }));
    var lmax = Math.max(c.target_leads, lp[lp.length - 1].v), smax = Math.max(c.budget, spp[spp.length - 1].v);
    lineChart(document.getElementById("ch-leads"), { pts: lp, plan: x.lead_path, start: s0, end: c.end, ymax: Math.ceil(lmax / 15) * 15, n: 3, f: function (v) { return String(Math.round(v)); }, label: "Leads so far against the plan" });
    lineChart(document.getElementById("ch-spend"), { pts: spp, plan: x.spend_path, start: s0, end: c.end, ymax: Math.ceil(smax / 1000) * 1000, n: Math.ceil(smax / 1000), f: function (v) { return v >= 1000 ? "$" + (Math.round(v / 100) / 10) + "k" : money(v); }, label: "Money spent against the plan" });
  }

  function plan(x) {
    return '<div class="rv">' + x.plan.map(function (w) {
      var st = w.week < x.week ? "done" : w.week === x.week ? "cur" : "";
      var label = st === "done" ? "Done" : st === "cur" ? "This week" : "Ahead";
      var res = (x.results || {})[w.week];
      return '<div class="wk ' + st + (st === "cur" ? " open" : "") + '"><button class="wkh" aria-expanded="' + (st === "cur") + '"><span class="num">' + w.week + "</span>" +
        '<span><span class="wt">' + esc(w.theme) + '</span><br><span class="wd">' + fmt(w.start, { month: "short", day: "numeric" }) + " – " + fmt(w.end, { month: "short", day: "numeric" }) +
        " · " + (w.budget ? money(w.budget) + " ads" : "no ad spend") + '</span></span><span class="pill">' + label + "</span></button>" +
        '<div class="wkb"><div><ul>' + w.items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul>" +
        "<p><b>Success looks like:</b> " + esc(w.success) + "</p>" + (res ? "<p><b>Result:</b> " + esc(res) + "</p>" : "") + "</div></div></div>";
    }).join("") + "</div>";
  }

  function render(x) {
    var c = x.campaign, t = x.today;
    var up = new Date(x.updated);
    var ny = up.toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    var dxb = up.toLocaleString("en-US", { timeZone: "Asia/Dubai", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    var wk = x.plan[x.week - 1] || {};
    app.innerHTML =
      '<header class="bar"><span class="mark">Vyttah</span><span class="bmeta">Campaign tracker<br>Updated ' + esc(dxb) + " Dubai</span></header>" +
      (SAMPLE ? '<div class="sample">Sample numbers for the preview, not real</div>' : "") +
      '<main class="page pre" id="page">' +
      '<p class="kick rv">UAE e-invoicing lead campaign · week ' + x.week + " of 10 · " + esc(wk.theme || "") + "</p>" +
      '<div class="panel rv"><div class="hero"><div class="big">' + x.days_left + '</div><p>days until <b>UAE e-invoicing</b><br>goes live on 1 January 2027</p></div>' +
      timeline(c, x.date) + '<div class="daynote"><span>Campaign day ' + x.day_n + " of " + x.days_total + "</span><span>" + money(x.kpis ? x.kpis.spend_total : 0) + " of " + money(c.budget) + " spent</span></div></div>" +
      (t ? '<h2 class="rv">Latest update</h2><p class="dlabel rv">' + fmt(t.date, { weekday: "long", month: "long", day: "numeric" }) + '</p><p class="today rv">' + esc(t.text) + "</p>" +
        (t.next ? '<div class="next rv"><span class="k">Next</span>' + esc(t.next) + "</div>" : "") : "") +
      '<h2 class="rv">' + ((x.series || []).length ? "Dashboard" : "Scoreboard") + "</h2>" + scoreboard(x) +
      '<h2 class="rv">The 10-week plan</h2>' + plan(x) +
      (x.log.length > 1 ? '<h2 class="rv">Earlier updates</h2><div class="log rv">' + x.log.slice(1).map(function (e) {
        return '<div class="ent"><div class="dl">' + fmt(e.date, { weekday: "short", month: "short", day: "numeric" }) + "</div><p>" + esc(e.text) + "</p>" +
          (e.next ? '<div class="nx">Next: ' + esc(e.next) + "</div>" : "") + "</div>";
      }).join("") + "</div>" : "") +
      '<div class="foot rv"><span>Updated every day at 8 PM New York (' + esc(ny) + ")<br>Budget $5,000 · UAE only · target 60 leads by 27 Dec</span><b>Sahil</b></div>" +
      "</main>";

    var page = document.getElementById("page");
    charts(x);
    var rw = page.clientWidth;
    window.addEventListener("resize", function () { if (page.clientWidth !== rw) { rw = page.clientWidth; charts(x); } });
    var btip = document.createElement("div"); btip.className = "tip"; document.body.appendChild(btip);
    function barTip(ev) {
      var b = ev.target.closest && ev.target.closest(".bars .b[data-tip]");
      if (!b) { btip.classList.remove("on"); return; }
      var r = b.querySelector("i").getBoundingClientRect();
      btip.innerHTML = b.getAttribute("data-tip");
      btip.style.left = Math.max(80, Math.min(innerWidth - 80, r.left + r.width / 2)) + "px"; btip.style.top = (r.top + scrollY) + "px"; btip.classList.add("on");
    }
    page.addEventListener("pointerover", barTip); page.addEventListener("pointerdown", barTip);
    page.addEventListener("pointerleave", function () { btip.classList.remove("on"); });
    var items = Array.prototype.slice.call(page.querySelectorAll(".rv"));
    if (MOTION && "IntersectionObserver" in window) {
      var i = 0;
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (!e.isIntersecting) return;
          var el = e.target; el.style.setProperty("--i", Math.min(i++, 8)); el.classList.add("in"); io.unobserve(el);
          setTimeout(function () { el.classList.add("done"); }, 1400);  // visible even if the animation is paused
        });
        setTimeout(function () { i = 0; }, 400);
      }, { rootMargin: "0px 0px -8% 0px" });
      items.forEach(function (el) { io.observe(el); });
      setTimeout(function () { items.forEach(function (el) { el.classList.add("in", "done"); }); }, 4000);  // never leave content hidden
    } else {
      items.forEach(function (el) { el.classList.add("in"); });
    }
    requestAnimationFrame(function () { requestAnimationFrame(function () { page.classList.remove("pre"); }); });
    page.addEventListener("click", function (ev) {
      var h = ev.target.closest(".wkh"); if (!h) return;
      var w = h.parentElement, open = w.classList.toggle("open"); h.setAttribute("aria-expanded", String(open));
    });
  }

  var local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]plain=(1|sample)/.test(location.search);
  var SAMPLE = local && /[?&]plain=sample/.test(location.search);
  if (local) { fetch(SAMPLE ? "data.sample.json" : "data.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(render); return; }
  fetch("data.enc.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (enc) {
    savedKey().then(function (key) { return decrypt(key, enc).then(render); }).catch(function () { lockScreen(enc); });
  }).catch(function () { app.innerHTML = '<div class="lock"><div class="panel"><div class="mark">Vyttah</div><p>Not published yet.</p></div></div>'; });
})();
</script>
</body>
</html>
